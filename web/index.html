<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonTile 切片规划与检测合并</title>
  <style>
    body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#203041;background:#fbfcfd}
    h1{margin-bottom:.2rem}h2{margin-top:2rem}p{line-height:1.6}fieldset{border:1px solid #b5c7cf;border-radius:6px;padding:1rem}
    .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:.8rem}label{display:block;font-size:.9rem}input{box-sizing:border-box;width:100%;margin-top:.3rem;padding:.45rem;font:inherit}
    textarea{width:100%;height:17rem;box-sizing:border-box;font:13px monospace}button{padding:.6rem 1rem;cursor:pointer;background:#1c5d78;color:white;border:0;border-radius:5px}button:disabled{opacity:.45;cursor:not-allowed}
    .actions{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}svg{width:100%;max-height:400px;background:#f4f8fa;border:1px solid #b5c7cf}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3f5;padding:1rem}.tile{fill:none;stroke:#4380a4;stroke-dasharray:4 3;stroke-width:1;vector-effect:non-scaling-stroke}.tile-label{fill:#254b60;font-family:system-ui;paint-order:stroke;stroke:#fff;stroke-width:.5;vector-effect:non-scaling-stroke}.source{fill:none;stroke:#a56a00;stroke-dasharray:3 2;stroke-width:1;vector-effect:non-scaling-stroke}.kept{fill:none;stroke:#12834c;stroke-width:2;vector-effect:non-scaling-stroke}.suppressed{fill:none;stroke:#d3544b;stroke-width:1;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}
  </style>
</head>
<body>
<h1>MoonTile</h1>
<p>规划图像切片，并查看检测框还原与合并的结果。所有计算在本地浏览器中完成。</p>
<section aria-labelledby="image-title">
  <h2 id="image-title">选择背景图（可选）</h2>
  <p>图片只在本地预览；尺寸与对应输入一致时才显示。选择图片不会修改已有预测。</p>
  <label for="background-file">选择 PNG、JPEG 或 WebP 图片</label>
  <input id="background-file" type="file" accept="image/png,image/jpeg,image/webp">
  <div class="actions"><button id="clear-background" type="button" disabled>移除背景图</button></div>
  <p id="background-status" role="status" aria-live="polite">未选择背景图。</p>
</section>
<section aria-labelledby="plan-title">
  <h2 id="plan-title">1. 规划切片</h2>
  <form id="plan-form">
    <fieldset><legend>图像与切片尺寸（像素）</legend>
      <div class="fields">
        <label>图像宽度<input id="image-width" type="number" min="1" step="1" value="100" required></label>
        <label>图像高度<input id="image-height" type="number" min="1" step="1" value="60" required></label>
        <label>切片宽度<input id="tile-width" type="number" min="1" step="1" value="60" required></label>
        <label>切片高度<input id="tile-height" type="number" min="1" step="1" value="60" required></label>
        <label>水平重叠<input id="overlap-x" type="number" min="0" step="1" value="20" required></label>
        <label>垂直重叠<input id="overlap-y" type="number" min="0" step="1" value="0" required></label>
      </div>
      <div class="actions"><button type="submit">生成规划</button><button type="button" id="use-plan" disabled>用此规划替换下方输入（清空预测）</button></div>
    </fieldset>
  </form>
  <p id="plan-status" role="status" aria-live="polite"></p>
  <svg id="plan-canvas" role="img" aria-label="切片规划图"></svg>
</section>
<section aria-labelledby="merge-title">
  <h2 id="merge-title">2. 还原与合并</h2>
  <p>编辑检测输入后运行合并。蓝色虚线为切片，橙色为还原框，红色为被抑制或合并的框，绿色为最终输出框。</p>
  <label for="input-file">导入切片预测 JSON（可选）</label><input id="input-file" type="file" accept="application/json,.json">
  <p id="file-status" role="status" aria-live="polite"></p>
  <label for="input">切片预测 JSON</label><textarea id="input" spellcheck="false"></textarea>
  <div class="actions"><button id="run" type="button">运行合并</button><button id="inspect-grid" type="button">检查切片完整性</button><button id="save-input" type="button">下载输入 JSON</button><button id="save-result" type="button" disabled>下载结果 JSON</button></div>
  <p>完整性检查需要输入包含 tile_plan；检查结果显示缺失、错误和多余切片的数量及编号样本。</p><pre id="inspect-report" aria-live="polite"></pre>
  <p id="merge-status" role="status" aria-live="polite"></p><svg id="canvas" role="img" aria-label="切片与检测框"></svg><pre id="report" aria-live="polite"></pre>
</section>
<script type="module" src="./app.mjs"></script>
</body></html>
