<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoonTile 检测合并</title>
<style>body{font:16px system-ui;max-width:1050px;margin:2rem auto;padding:0 1rem;color:#203041}h1{margin-bottom:.2rem}p{line-height:1.6}textarea{width:100%;height:17rem;box-sizing:border-box;font:13px monospace}button{padding:.6rem 1rem;cursor:pointer;background:#1c5d78;color:white;border:0;border-radius:5px}svg{width:100%;max-height:400px;background:#f4f8fa;border:1px solid #b5c7cf}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3f5;padding:1rem}.tile{fill:none;stroke:#4380a4;stroke-dasharray:2 1;stroke-width:.3}.source{fill:none;stroke:#a56a00;stroke-dasharray:1 1;stroke-width:.4}.kept{fill:none;stroke:#12834c;stroke-width:.8}.suppressed{fill:none;stroke:#d3544b;stroke-width:.5;stroke-dasharray:1 1}</style></head>
<body><h1>MoonTile</h1><p>蓝色虚线为切片，橙色为还原框，红色为被合并或抑制的框，绿色为最终输出框。编辑输入后由浏览器中的 MoonBit 核心重新计算。</p><textarea id="input"></textarea><p><button id="run">运行合并</button></p><svg id="canvas" role="img" aria-label="切片与检测框"></svg><pre id="report"></pre>
<script type="module">
import { moontile_process } from './moontile.mjs';
const input = document.querySelector('#input'), svg = document.querySelector('#canvas'), report = document.querySelector('#report');
input.value = JSON.stringify({image_width:100,image_height:60,threshold:.5,metric:'ios',class_agnostic:false,strategy:'greedy_nmm',tiles:[{tile:{id:0,x:0,y:0,width:60,height:60},detections:[{id:1,image_id:1,tile_id:0,class_id:0,score:.95,box:{x1:45,y1:10,x2:60,y2:30}}]},{tile:{id:1,x:40,y:0,width:60,height:60},detections:[{id:2,image_id:1,tile_id:1,class_id:0,score:.85,box:{x1:10,y1:10,x2:30,y2:30}}]}]},null,2);
function draw(){try{const src=JSON.parse(input.value), out=JSON.parse(moontile_process(input.value));if(out.error)throw Error(out.error);svg.setAttribute('viewBox',`0 0 ${src.image_width} ${src.image_height}`);svg.replaceChildren();const rect=(x,y,w,h,cls)=>{const e=document.createElementNS('http://www.w3.org/2000/svg','rect');Object.entries({x,y,width:w,height:h,class:cls}).forEach(([k,v])=>e.setAttribute(k,v));svg.append(e)};for(const {tile:t} of src.tiles)rect(t.x,t.y,t.width,t.height,'tile');const ids=new Set(out.suppressed.map(x=>x.suppressed_id));for(const d of out.restored){const b=d.box;rect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1,ids.has(d.id)?'suppressed':'source')}for(const d of out.kept){const b=d.box;rect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1,'kept')}report.textContent=JSON.stringify(out,null,2)}catch(e){report.textContent=String(e)}}
document.querySelector('#run').addEventListener('click',draw);draw();
</script></body></html>
