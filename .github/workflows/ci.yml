name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.25
        with:
          version: 0.10.14+7d59c7ec9
          core-version: 0.10.14+7d59c7ec9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: moon update
      - run: moon fmt --check
      - run: moon -C examples/consumer fmt --check
      - run: moon check --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon -C examples/consumer test --target all --deny-warn
      - run: node web/build.mjs && node web/test.mjs && node web/ui_test.mjs && node web/stream_test.mjs && node web/trace_stream_test.mjs
      - uses: actions/checkout@v4
        with:
          repository: obss/sahi
          ref: 0077a143abdabad2ac81eb375377c744662f7578
          path: _build/sahi-reference
          persist-credentials: false
      - run: |
          binary=_build/native/debug/build/cmd/main/main.exe
          if [ ! -x "$binary" ]; then binary=_build/native/debug/build/cmd/main/main; fi
          python validation/sahi_layout.py --sahi-dir _build/sahi-reference --binary "$binary" --output "$RUNNER_TEMP/sahi-layout-results.json"
          python validation/replay_tiled_coco.py --binary "$binary"
          python validation/replay_tiled_coco.py --binary "$binary" --raw validation/scale/predictions.json --report validation/scale/results.json --clip-boundary --require-plan
      - run: |
          moon build validation/batch_bench --target native
          bench=_build/native/debug/build/validation/batch_bench/batch_bench.exe
          if [ ! -x "$bench" ]; then bench=_build/native/debug/build/validation/batch_bench/batch_bench; fi
          "$bench" --real validation/scale/predictions.json
      - uses: actions/checkout@v4
        with:
          repository: python123-ops/mbmot
          ref: 1021f4e7c24a8c865e114d97111ffd969f6b515f
          path: _build/mbmot-reference
          persist-credentials: false
      - run: |
          moon -C _build/mbmot-reference update
          moon -C _build/mbmot-reference build src/replay --target native
          binary=_build/native/debug/build/cmd/main/main.exe
          if [ ! -x "$binary" ]; then binary=_build/native/debug/build/cmd/main/main; fi
          tracker=_build/mbmot-reference/_build/native/debug/build/replay/replay.exe
          if [ ! -x "$tracker" ]; then tracker=_build/mbmot-reference/_build/native/debug/build/replay/replay; fi
          python validation/real_tiled_video.py replay --moontile "$binary" --mbmot "$tracker"
          python validation/real_tiled_video.py replay --moontile "$binary" --mbmot "$tracker" --raw validation/video-scale/predictions.json --output-frames validation/video-scale/detections.json --tracks validation/video-scale/tracks.json --report validation/video-scale/results.json
      - run: moon package
      - run: python validation/package_consumer.py --archive _build/publish/python123-ops-moontile-0.1.0.zip
